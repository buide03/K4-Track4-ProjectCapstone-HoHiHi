# ByteTrack tuned for forward dashcam video (Ultralytics defaults otherwise).
# A longer buffer keeps a lead vehicle's ID while a cutting-in vehicle briefly occludes it.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 60
match_thresh: 0.8
fuse_score: True
